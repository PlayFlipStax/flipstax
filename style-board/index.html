<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FlipStax Style Board</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#1c0b3d; --ink:#fff6d8; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; }
  main{ width:100%; max-width:760px; }
  h1{ font:900 40px/1 'Big Shoulders Display', sans-serif; letter-spacing:1px; color:#ffd23f; margin:0 0 6px; }
  p{ margin:0 0 20px; color:#d8c8f5; line-height:1.5; }
  .pick{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); }
  a{ display:block; padding:22px; border-radius:24px; text-decoration:none; }
  a b{ display:block; font-size:30px; line-height:1.05; margin-bottom:6px; }
  a span{ font-size:14px; line-height:1.45; }
  .a{ color:#2a1300; background:radial-gradient(120% 90% at 50% 0%, #ffe27a, #ff8a1f 55%, #c2275f); border:4px solid #7a3d00; box-shadow:0 7px 0 #7a3d00; }
  .a b{ font-family:'Big Shoulders Display', sans-serif; font-weight:900; text-transform:uppercase; }
</style>
</head>
<body>
<main>
  <h1>FlipStax style board</h1>
  <p>The new look, with one sample of every screen type at phone width. Tap around; nothing here is wired into the game.</p>
  <div class="pick">
    <a class="a" href="a.html"><b>A · Showtime</b><span>The briefed TV game show: turning sunburst, chasing marquee bulbs, chunky gold buttons, big condensed numerals.</span></a>
  </div>
</main>
</body>
</html>
